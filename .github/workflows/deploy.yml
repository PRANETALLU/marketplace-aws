name: Simple Deploy — Client & Server

on:
  push:
    branches: [ main, staging ]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build and deploy (client + server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build client
        run: |
          cd client/my-app
          npm ci
          npm run build

      - name: Install server handlers and layers dependencies
        run: |
          cd server
          # Install dependencies for any Node.js Lambda layers
          for layer_dir in layers/*/nodejs; do
            if [ -d "$layer_dir" ]; then
              (
                cd "$layer_dir"
                if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                  npm ci
                else
                  npm install --no-audit --no-fund
                fi
              )
            fi
          done

          # Install dependencies for each function handler that has a package.json
          for handler in handlers/*/*; do
            if [ -f "$handler/package.json" ]; then
              (
                cd "$handler"
                if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                  npm ci
                else
                  npm install --no-audit --no-fund
                fi
              )
            fi
          done

      - name: Build and deploy server (SAM)
        run: |
          cd server
          sam build
          ENV_NAME=production
          if [ "${GITHUB_REF#refs/heads/}" = "staging" ]; then ENV_NAME=staging; fi
          # deploy without passing sensitive parameters here; configure via samconfig or Parameter Store
          sam deploy --config-env $ENV_NAME --no-confirm-changeset

      - name: Deploy client to S3
        run: |
          ENV_NAME=production

          if [ "${GITHUB_REF#refs/heads/}" = "staging" ]; then
            ENV_NAME=staging
          fi

          BUCKET_NAME="marketplace-${ENV_NAME}-123"

          aws s3 sync client/my-app/dist/ s3://$BUCKET_NAME \
            --delete \
            --cache-control "public, max-age=3600" \
            --region ${{ env.AWS_REGION }}

      - name: Print API endpoint (best-effort)
        run: |
          ENV_NAME=production
          if [ "${GITHUB_REF#refs/heads/}" = "staging" ]; then ENV_NAME=staging; fi
          aws cloudformation describe-stacks --stack-name marketplace-api-$ENV_NAME --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' --region ${{ env.AWS_REGION }} --output text || true
