name: Simple Deploy — Client & Server

on:
  push:
    branches: [ main, staging ]

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build and deploy (client + server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write client env file
        run: |
          ENV_NAME=production
          if [ "${GITHUB_REF#refs/heads/}" = "staging" ]; then ENV_NAME=staging; fi

          if [ "$ENV_NAME" = "staging" ]; then
            printf 'VITE_ENVIRONMENT=staging\nVITE_API_URL=%s\nVITE_COGNITO_USER_POOL_ID=%s\nVITE_COGNITO_CLIENT_ID=%s\n' \
              "${{ secrets.STAGING_API_URL }}" \
              "${{ secrets.STAGING_COGNITO_USER_POOL_ID }}" \
              "${{ secrets.STAGING_COGNITO_CLIENT_ID }}" \
              > client/my-app/.env.staging
          else
            printf 'VITE_ENVIRONMENT=production\nVITE_API_URL=%s\nVITE_COGNITO_USER_POOL_ID=%s\nVITE_COGNITO_CLIENT_ID=%s\n' \
              "${{ secrets.PRODUCTION_API_URL }}" \
              "${{ secrets.PRODUCTION_COGNITO_USER_POOL_ID }}" \
              "${{ secrets.PRODUCTION_COGNITO_CLIENT_ID }}" \
              > client/my-app/.env.production
          fi

      - name: Build client
        run: |
          cd client/my-app
          npm ci
          ENV_NAME=production
          if [ "${GITHUB_REF#refs/heads/}" = "staging" ]; then ENV_NAME=staging; fi
          npm run build:$ENV_NAME

      - name: Install server handlers and layers dependencies
        run: |
          cd server
          # Install dependencies for any Node.js Lambda layers
          for layer_dir in layers/*/nodejs; do
            if [ -d "$layer_dir" ]; then
              (
                cd "$layer_dir"
                if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                  npm ci
                else
                  npm install --no-audit --no-fund
                fi
              )
            fi
          done

          # Install dependencies for each function handler that has a package.json
          for handler in handlers/*/*; do
            if [ -f "$handler/package.json" ]; then
              (
                cd "$handler"
                if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
                  npm ci
                else
                  npm install --no-audit --no-fund
                fi
              )
            fi
          done

      - name: Build and deploy server (SAM)
        run: |
          cd server
          sam build
          ENV_NAME=production
          if [ "${GITHUB_REF#refs/heads/}" = "staging" ]; then ENV_NAME=staging; fi
          # deploy without passing sensitive parameters here; configure via samconfig or Parameter Store
          sam deploy --config-env $ENV_NAME --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Deploy client to S3
        run: |
          ENV_NAME=production
          if [ "${GITHUB_REF#refs/heads/}" = "staging" ]; then ENV_NAME=staging; fi

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name marketplace-api-$ENV_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`ClientHostingBucketName`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
            echo "ERROR: Could not resolve ClientHostingBucketName from stack outputs"
            exit 1
          fi

          echo "Syncing to bucket: $BUCKET_NAME"
          echo "dist/ contents:"
          ls client/my-app/dist/

          aws s3 sync client/my-app/dist/ s3://$BUCKET_NAME \
            --delete \
            --cache-control "public, max-age=3600" \
            --region ${{ env.AWS_REGION }}

          echo "Sync complete. Object count:"
          aws s3 ls s3://$BUCKET_NAME --recursive --summarize --region ${{ env.AWS_REGION }} | tail -2

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name marketplace-api-$ENV_NAME \
            --query 'Stacks[0].Outputs[?OutputKey==`ClientCDNDistributionId`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            echo "Invalidating CloudFront cache for distribution: $DISTRIBUTION_ID"
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          else
            echo "No CloudFront distribution ID found, skipping invalidation"
          fi

      - name: Print deployment URLs
        run: |
          ENV_NAME=production
          if [ "${GITHUB_REF#refs/heads/}" = "staging" ]; then ENV_NAME=staging; fi
          echo "=== API Endpoint ==="
          aws cloudformation describe-stacks --stack-name marketplace-api-$ENV_NAME --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' --region ${{ env.AWS_REGION }} --output text || true
          echo "=== Frontend URL (CloudFront HTTPS) ==="
          aws cloudformation describe-stacks --stack-name marketplace-api-$ENV_NAME --query 'Stacks[0].Outputs[?OutputKey==`ClientWebsiteURL`].OutputValue' --region ${{ env.AWS_REGION }} --output text || true
